<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[RESTRICTED] NATIONAL ANOMALY ARCHIVE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'VT323', 'Share Tech Mono', monospace;
            padding: 20px;
            font-size: 20px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.6);
            line-height: 1.4;
            overflow-x: hidden;
        }

        /* CRT 화면 스캔라인 효과 */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            border: 2px solid #00ff66;
            padding: 24px;
            background: rgba(0, 20, 10, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        header {
            border-bottom: 2px dashed #00ff66;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .classified-tag {
            color: #ff3333;
            text-shadow: 0 0 6px rgba(255, 51, 51, 0.8);
            font-weight: bold;
            font-size: 24px;
        }

        /* 구역(Zone) 필터 탭 바 */
        .zone-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(0, 255, 102, 0.3);
            padding-bottom: 12px;
        }

        .zone-btn {
            background: rgba(0, 30, 10, 0.5);
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 6px 14px;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .zone-btn:hover, .zone-btn.active {
            background: #00ff66;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 8px #00ff66;
        }

        .zone-desc {
            font-size: 16px;
            color: #88ffaa;
            margin-bottom: 15px;
            padding-left: 5px;
            border-left: 3px solid #00ff66;
        }

        .archive-list { list-style: none; }

        .archive-item {
            border: 1px solid rgba(0, 255, 102, 0.3);
            margin-bottom: 12px;
            padding: 12px 16px;
            background: rgba(0, 30, 10, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .archive-item:hover {
            background: #00ff66;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 10px #00ff66;
        }

        /* 기밀 등급 뱃지 */
        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 15px;
            margin-right: 8px;
            border-radius: 2px;
            font-weight: bold;
        }
        .badge-lv1 { background: #ff3333; color: #fff; text-shadow: none; } /* 비밀 1급 */
        .badge-lv2 { background: #ff9900; color: #000; text-shadow: none; } /* 비밀 2급 */
        .badge-lv3 { background: #3388ff; color: #fff; text-shadow: none; } /* 비밀 3급 */

        .archive-item .date { color: #88ffaa; font-size: 18px; }
        .archive-item:hover .date { color: #000; }

        /* 팝업 모달창 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #0b120c;
            border: 2px solid #ff3333;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
            padding: 24px;
            max-width: 650px;
            width: 100%;
            color: #e0e0e0;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            color: #ff3333;
            font-size: 24px;
            border-bottom: 1px solid #ff3333;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            color: #ff3333;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
        }
        .close-btn:hover { color: #fff; }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="classified-tag">[기밀 전산망] NATIONAL ANOMALY ARCHIVE</div>
        <p>기록 관리국: 제4특수조사과 통제구역 전산실 (TERMINAL-04)</p>
        <p>통신 상태: <span class="blink" style="color:#00ff66;">SECURED</span> / 계층형 디렉토리 활성화</p>
    </header>

    <!-- 1단계 대분류: ZONE 선택 탭 -->
    <div class="zone-nav">
        <button class="zone-btn active" onclick="switchZone('ALL')">[전체 구역]</button>
        <button class="zone-btn" onclick="switchZone('ZONE-3')">ZONE-3 (일반 통제)</button>
        <button class="zone-btn" onclick="switchZone('ZONE-2')">ZONE-2 (위험 격리)</button>
        <button class="zone-btn" onclick="switchZone('ZONE-1')">ZONE-1 (심각 오염)</button>
        <button class="zone-btn" onclick="switchZone('ZONE-0')">ZONE-0 (완전 소멸/소실)</button>
    </div>

    <div id="zoneDescription" class="zone-desc">
        >> 전체 관할 구역 내 등록된 모든 회수 기록물을 표시 중입니다.
    </div>

    <!-- 2단계 세부 목록 -->
    <div>
        <ul id="archiveList" class="archive-list"></ul>
    </div>

    <footer style="margin-top: 30px; font-size: 16px; color: #558866; border-top: 1px dashed #558866; padding-top: 10px;">
        WARNING: 보안 인가 등급을 초과하는 데이터의 무단 열람 시 즉시 IP 추적 및 고발 조치됩니다.
    </footer>
</div>

<!-- 팝업창 -->
<div id="archiveModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">[X] 닫기</span>
        <div id="modalTitle" class="modal-header"></div>
        <div id="modalBody" style="font-size: 18px; line-height: 1.6;"></div>
    </div>
</div>

<script>
    /* ==========================================================
       📁 [데이터 영역]: 구역(Zone)과 기밀 등급(Security Level) 지정
    ========================================================== */
    const zoneDescriptions = {
        'ALL': '>> 전체 관할 구역 내 등록된 모든 회수 기록물을 표시 중입니다.',
        'ZONE-3': '>> ZONE-3: 민간인 접근 차단 및 기초 관측 구역 (경미한 변칙성)',
        'ZONE-2': '>> ZONE-2: 생체 변이 및 이상 전자기파 감지 구역 (탐사 장비 손실률 40%)',
        'ZONE-1': '>> ZONE-1: 구조적 붕괴 및 침식 진행 구역 (인명 투입 전면 금지 / 3등급 이상)',
        'ZONE-0': '>> ZONE-0: 현실 붕괴 및 미식별 개체 상주 구역 (물리적 진입 불가 / 영구 봉인)'
    };

    const caseDatabase = [
        {
            zone: "ZONE-1",
            level: "1급", // 1급, 2급, 3급
            id: "CASE-01",
            title: "청하공고 폐교 수색 및 피격 푸티지",
            date: "2004-10-14",
            modalHeader: "[ZONE-1 / 기밀 1급] 청하공고 내부 탐사 및 신호 두절",
            content: `
                <b>[보안 인가]</b>: 비밀 1급 (Top Secret)<br>
                <b>[관할 구역]</b>: ZONE-1 (강원도 청화군 영하읍 일대)<br>
                <b>[일시]</b>: 2004.10.14 23:42<br><br>
                <b>[사건 개요]</b><br>
                지상 탐사 로봇 ROVER-02 투입. 3층 교실 미닫이문 상단에서 거꾸로 고정된 비정상적 기형 인영 포착 후 00:58 지점에서 물리적 피격으로 통신 두절.<br><br>
                <b>[교내 방송 녹취]</b><br>
                “창밖에서 부르는 소리에 절대 응답하지 마십시오...”<br><br>
                <b>[조치 결과]</b><br>
                외곽 철조망 설치 및 콘크리트 매몰 봉쇄 완료.
            `
        },
        {
            zone: "ZONE-3",
            level: "3급",
            id: "CASE-02",
            title: "국도 44호선 심야 블랙박스 복구 기록",
            date: "2001-07-22",
            modalHeader: "[ZONE-3 / 기밀 3급] 국도 44호선 심야 인영 반복 포착",
            content: `
                <b>[보안 인가]</b>: 비밀 3급 (Restricted)<br>
                <b>[관할 구역]</b>: ZONE-3 (야간 통제 도로)<br>
                <b>[일시]</b>: 2001.07.22<br><br>
                <b>[사건 개요]</b><br>
                가로등 점멸 구간마다 동일 체격의 인영이 100m 간격으로 반복 포착됨. 운전자 행방불명 처리.
            `
        },
        {
            zone: "ZONE-2",
            level: "2급",
            id: "CASE-03",
            title: "신도시 미분양 단지 심야 엘리베이터 감시록",
            date: "2007-11-03",
            modalHeader: "[ZONE-2 / 기밀 2급] 지하 2층 승강기 내부 이상 반사체",
            content: `
                <b>[보안 인가]</b>: 비밀 2급 (Secret)<br>
                <b>[관할 구역]</b>: ZONE-2 (격리 단지)<br>
                <b>[일시]</b>: 2007.11.03<br><br>
                <b>[사건 개요]</b><br>
                14층에서 정지 후 문 개폐 반복. 거울 반사면에 승객 외의 인영 식별. 전력 강제 차단 후 폐쇄.
            `
        },
        {
            zone: "ZONE-0",
            level: "1급",
            id: "CASE-04",
            title: "동해안 제3청명호 심해 교신 유실 기록",
            date: "1995-12-02",
            modalHeader: "[ZONE-0 / 기밀 1급] 심해 음파 탐사 및 선체 소실 건",
            content: `
                <b>[보안 인가]</b>: 비밀 1급 (Top Secret)<br>
                <b>[관할 구역]</b>: ZONE-0 (심해 소멸 구역)<br>
                <b>[일시]</b>: 1995.12.02<br><br>
                <b>[사건 개요]</b><br>
                선체 하부에서 미확인 대형 인력 작용 감지. “바다 밑에서 배를 끌어내리고 있다” 교신 후 잔해 없이 소실.
            `
        }
    ];

    let currentZone = 'ALL';

    /* ==========================================================
       ⚙️ [렌더링 및 필터링 엔진]
    ========================================================== */
    function switchZone(zoneKey) {
        currentZone = zoneKey;
        
        // 탭 활성화 UI 처리
        document.querySelectorAll('.zone-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText.includes(zoneKey) || (zoneKey === 'ALL' && btn.innerText.includes('전체'))) {
                btn.classList.add('active');
            }
        });

        // 안내 문구 변경
        document.getElementById('zoneDescription').innerText = zoneDescriptions[zoneKey];

        renderList();
    }

    function getBadgeClass(level) {
        if (level === '1급') return 'badge-lv1';
        if (level === '2급') return 'badge-lv2';
        return 'badge-lv3';
    }

    function renderList() {
        const listElement = document.getElementById('archiveList');
        listElement.innerHTML = '';

        // 구역 필터링
        const filtered = caseDatabase.filter(item => currentZone === 'ALL' || item.zone === currentZone);

        if (filtered.length === 0) {
            listElement.innerHTML = '<li style="color:#558866; padding:15px;">>> 해당 구역에 등록된 회수 기록이 존재하지 않습니다.</li>';
            return;
        }

        filtered.forEach(item => {
            const originalIndex = caseDatabase.indexOf(item);
            const li = document.createElement('li');
            li.className = 'archive-item';
            li.onclick = () => openModal(originalIndex);
            li.innerHTML = `
                <div>
                    <span class="badge ${getBadgeClass(item.level)}">${item.level}</span>
                    <span>[${item.zone}] ${item.title}</span>
                </div>
                <span class="date">${item.date}</span>
            `;
            listElement.appendChild(li);
        });
    }

    function openModal(index) {
        const item = caseDatabase[index];
        document.getElementById('modalTitle').innerHTML = item.modalHeader;
        document.getElementById('modalBody').innerHTML = item.content;
        document.getElementById('archiveModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('archiveModal').style.display = 'none';
    }

    renderList();
</script>

</body>
</html>
