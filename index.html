<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[RESTRICTED] NATIONAL ANOMALY ARCHIVE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'VT323', 'Share Tech Mono', monospace;
            padding: 20px;
            font-size: 20px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.6);
            line-height: 1.4;
            overflow-x: hidden;
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            border: 2px solid #00ff66;
            padding: 24px;
            background: rgba(0, 20, 10, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        header {
            border-bottom: 2px dashed #00ff66;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .classified-tag {
            color: #ff3333;
            text-shadow: 0 0 6px rgba(255, 51, 51, 0.8);
            font-weight: bold;
            font-size: 24px;
        }

        .archive-list { list-style: none; margin-top: 15px; }

        .archive-item {
            border: 1px solid rgba(0, 255, 102, 0.3);
            margin-bottom: 12px;
            padding: 12px 16px;
            background: rgba(0, 30, 10, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .archive-item:hover {
            background: #00ff66;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 10px #00ff66;
        }

        .archive-item .date { color: #88ffaa; font-size: 18px; }
        .archive-item:hover .date { color: #000; }

        /* 팝업 모달창 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #0b120c;
            border: 2px solid #ff3333;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
            padding: 24px;
            max-width: 650px;
            width: 100%;
            color: #e0e0e0;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            color: #ff3333;
            font-size: 24px;
            border-bottom: 1px solid #ff3333;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            color: #ff3333;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
        }
        .close-btn:hover { color: #fff; }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="classified-tag">[기밀 열람 제한: 3등급] NATIONAL ANOMALY ARCHIVE</div>
        <p>기록 관리국: 제4특수조사과 비공개 서고 (DATABASE: KR-RECORDS)</p>
        <p>SYSTEM STATUS: <span class="blink" style="color:#00ff66;">ONLINE</span> / ACCESS GRANTED</p>
    </header>

    <div>
        <p>>> 회수된 단편 사건 기록 목록 (클릭 시 세부 내용 열람):</p>
        <!-- 자바스크립트가 여기에 목록을 자동으로 뿌려줍니다 -->
        <ul id="archiveList" class="archive-list"></ul>
    </div>

    <footer style="margin-top: 30px; font-size: 16px; color: #558866; border-top: 1px dashed #558866; padding-top: 10px;">
        WARNING: 본 시스템 내 모든 데이터의 외부 유출을 엄격히 금합니다.
    </footer>
</div>

<!-- 팝업창 -->
<div id="archiveModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">[X] 닫기</span>
        <div id="modalTitle" class="modal-header"></div>
        <div id="modalBody" style="font-size: 18px; line-height: 1.6;"></div>
    </div>
</div>

<script>
    /* ==========================================================
       📁 [데이터 영역]: 새 사건이 생기면 아래 배열에 복사해서 추가만 하면 끝!
       백틱(` `)을 사용하므로 줄바꿈, 따옴표, HTML 태그를 자유롭게 적을 수 있습니다.
    ========================================================== */
    const caseDatabase = [
        {
            id: "CASE-01",
            title: "청하공고 내부 탐사 및 신호 두절 푸티지",
            date: "2004-10-14",
            modalHeader: "CASE-01: 청하공고 폐교 수색 및 피격 기록",
            content: `
                <b>[사건 개요]</b><br>
                2004.10.14 23:42 수색 투입. 지상 탐사 로봇 ROVER-02 및 FPV 드론 영상 복구본. 3층 교실 및 미닫이문 상단에서 비정상적 인영 포착 후 신호 두절.<br><br>
                <b>[녹취 기록]</b><br>
                “교내 방송입니다. 창밖에서 부르는 소리에 절대 응답하지 마십시오. 문 열어주지 마...”<br><br>
                <b>[처분 결과]</b><br>
                시설 영구 폐쇄 및 인근 도로 통제 조치 완료.
            `
        },
        {
            id: "CASE-02",
            title: "국도 44호선 심야 블랙박스 복구 기록",
            date: "2001-07-22",
            modalHeader: "CASE-02: 국도 44호선 야간 블랙박스 복구본",
            content: `
                <b>[사건 개요]</b><br>
                2001.07.22 심야 운행 차량 회수 블랙박스. 가로등 점멸 구간마다 동일한 체격의 인영이 100m 간격으로 반복 포착됨.<br><br>
                <b>[상태]</b><br>
                차량 운전자 행방불명. 테이프 손상 구간 복구 완료.
            `
        },
        {
            id: "CASE-03",
            title: "지하 2층 승강기 내부 감시 영상",
            date: "2007-11-03",
            modalHeader: "CASE-03: 신도시 미분양 단지 심야 엘리베이터",
            content: `
                <b>[사건 개요]</b><br>
                2007.11.03 심야 CCTV 감시 기록. 14층에서 정지 후 문 개폐 반복. 승강기 거울 반사면에 승객 외의 인영 감지.<br><br>
                <b>[상태]</b><br>
                전력 강제 차단 후 출입구 콘크리트 봉인.
            `
        }
    ];

    /* ==========================================================
       ⚙️ [렌더링 엔진]: 건드릴 필요 없이 화면에 자동으로 그려줍니다.
    ========================================================== */
    function renderList() {
        const listElement = document.getElementById('archiveList');
        listElement.innerHTML = '';

        caseDatabase.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'archive-item';
            li.onclick = () => openModal(index);
            li.innerHTML = `
                <span>📁 [${item.id}]${item.title}</span>
                <span class="date">${item.date}</span>
            `;
            listElement.appendChild(li);
        });
    }

    function openModal(index) {
        const item = caseDatabase[index];
        document.getElementById('modalTitle').innerHTML = item.modalHeader;
        document.getElementById('modalBody').innerHTML = item.content;
        document.getElementById('archiveModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('archiveModal').style.display = 'none';
    }

    // 페이지 로드 시 목록 자동 생성
    renderList();
</script>

</body>
</html>
