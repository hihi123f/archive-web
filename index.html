<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[RESTRICTED] NATIONAL ANOMALY ARCHIVE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #050806;
            color: #00ff66;
            font-family: 'VT323', 'Share Tech Mono', -apple-system, BlinkMacSystemFont, monospace;
            padding: 12px;
            font-size: 19px;
            text-shadow: 0 0 4px rgba(0, 255, 102, 0.6);
            line-height: 1.4;
            overflow-x: hidden;
        }

        /* CRT 화면 스캔라인 효과 */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 10;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            border: 2px solid #00ff66;
            padding: 16px;
            background: rgba(0, 20, 10, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        header {
            border-bottom: 2px dashed #00ff66;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .classified-tag {
            color: #ff3333;
            text-shadow: 0 0 6px rgba(255, 51, 51, 0.8);
            font-weight: bold;
            font-size: 22px;
            word-break: break-all;
        }

        .zone-nav {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(0, 255, 102, 0.3);
            padding-bottom: 10px;
        }

        .zone-btn {
            background: rgba(0, 30, 10, 0.6);
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 6px 10px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            flex: 1 1 auto;
            text-align: center;
        }

        .zone-btn:hover, .zone-btn.active {
            background: #00ff66;
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 8px #00ff66;
        }

        .zone-desc {
            font-size: 15px;
            color: #88ffaa;
            margin-bottom: 14px;
            padding-left: 6px;
            border-left: 3px solid #00ff66;
            line-height: 1.3;
        }

        .archive-list { list-style: none; }

        .archive-item {
            border: 1px solid rgba(0, 255, 102, 0.3);
            margin-bottom: 10px;
            padding: 10px 14px;
            background: rgba(0, 30, 10, 0.2);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .archive-item:hover, .archive-item:active {
            background: #00ff66;
            color: #000;
            text-shadow: none;
            box-shadow: 0 0 10px #00ff66;
        }

        .badge {
            display: inline-block;
            padding: 1px 5px;
            font-size: 14px;
            margin-right: 6px;
            font-weight: bold;
        }
        .badge-lv1 { background: #ff3333; color: #fff; text-shadow: none; }
        .badge-lv2 { background: #ff9900; color: #000; text-shadow: none; }
        .badge-lv3 { background: #3388ff; color: #fff; text-shadow: none; }

        .archive-item .date { color: #88ffaa; font-size: 16px; }
        .archive-item:hover .date { color: #000; }

        /* 문서 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 20;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .modal-content {
            background: #0b120c;
            border: 2px solid #ff3333;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
            padding: 18px;
            max-width: 650px;
            width: 100%;
            color: #e0e0e0;
            position: relative;
            max-height: 88vh;
            overflow-y: auto;
        }

        .modal-header {
            color: #ff3333;
            font-size: 21px;
            border-bottom: 1px solid #ff3333;
            margin-bottom: 12px;
            padding-bottom: 4px;
            padding-right: 30px;
            word-break: break-all;
        }

        .close-btn {
            position: absolute;
            top: 14px; right: 14px;
            color: #ff3333;
            cursor: pointer;
            font-size: 22px;
            font-weight: bold;
        }

        .btn-video {
            display: block;
            width: 100%;
            margin-top: 14px;
            background: rgba(255, 51, 51, 0.2);
            border: 1px solid #ff3333;
            color: #ff8888;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-family: inherit;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-video:hover {
            background: #ff3333;
            color: #000;
        }

        /* 🎥 다크웹 CCTV / 비디오 전용 팝업창 */
        .video-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 30;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .video-box {
            background: #000;
            border: 2px solid #ff3333;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.6);
            width: 100%;
            max-width: 480px; /* 숏폼 영상 세로 비율에 최적화 */
            position: relative;
            padding: 10px;
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            color: #ff3333;
            font-size: 16px;
            margin-bottom: 8px;
            border-bottom: 1px dashed #ff3333;
            padding-bottom: 4px;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 177.77%; /* 9:16 세로 숏폼 비율 */
            background: #050505;
            overflow: hidden;
        }

        .video-container iframe, .video-container video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="classified-tag">[기밀 전산망] NATIONAL ANOMALY ARCHIVE</div>
        <p style="font-size: 16px;">기록 관리국: 제4특수조사과 통제구역 전산실</p>
        <p style="font-size: 16px;">STATUS: <span class="blink" style="color:#00ff66;">ONLINE</span> / SECURED</p>
    </header>

    <div class="zone-nav">
        <button class="zone-btn active" onclick="switchZone('ALL')">ALL</button>
        <button class="zone-btn" onclick="switchZone('ZONE-3')">ZONE-3</button>
        <button class="zone-btn" onclick="switchZone('ZONE-2')">ZONE-2</button>
        <button class="zone-btn" onclick="switchZone('ZONE-1')">ZONE-1</button>
        <button class="zone-btn" onclick="switchZone('ZONE-0')">ZONE-0</button>
    </div>

    <div id="zoneDescription" class="zone-desc">
        >> 전체 관할 구역 내 등록된 모든 회수 기록물을 표시 중입니다.
    </div>

    <div>
        <ul id="archiveList" class="archive-list"></ul>
    </div>

    <footer style="margin-top: 24px; font-size: 14px; color: #558866; border-top: 1px dashed #558866; padding-top: 8px;">
        WARNING: 비인가 데이터 무단 유출 시 군사기밀보호법에 의거 조치됩니다.
    </footer>
</div>

<!-- 1. 문서 팝업창 -->
<div id="archiveModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">[X]</span>
        <div id="modalTitle" class="modal-header"></div>
        <div id="modalBody" style="font-size: 17px; line-height: 1.5;"></div>
        <!-- 비디오 재생 버튼 -->
        <button id="videoPlayBtn" class="btn-video" style="display:none;" onclick="openVideoPlayer()">
            ▶ [SURVEILLANCE FEED: 복구 영상 열람]
        </button>
    </div>
</div>

<!-- 2. 다크웹 전용 내부 비디오 플레이어 팝업창 -->
<div id="videoModal" class="video-modal" onclick="closeVideoPlayer()">
    <div class="video-box" onclick="event.stopPropagation()">
        <div class="video-header">
            <span>REC_FEED // <span class="blink" style="color:#ff3333;">LIVE_DECRYPT</span></span>
            <span style="cursor:pointer; font-weight:bold;" onclick="closeVideoPlayer()">[X 닫기]</span>
        </div>
        <div class="video-container">
            <iframe id="videoPlayerFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>
</div>

<script>
    const zoneDescriptions = {
        'ALL': '>> 전체 관할 구역 내 등록된 모든 회수 기록물을 표시 중입니다.',
        'ZONE-3': '>> ZONE-3: 민간인 접근 차단 및 기초 관측 구역',
        'ZONE-2': '>> ZONE-2: 생체 변이 및 이상 전자기파 감지 구역',
        'ZONE-1': '>> ZONE-1: 구조적 침식 진행 구역 (인명 투입 영구 금지)',
        'ZONE-0': '>> ZONE-0: 현실 붕괴 및 물리적 진입 불가 구역'
    };

    /* ==========================================================
       📁 [데이터 영역] : videoUrl 에 유튜브 임베드 주소 입력
       (유튜브 영상 ID가 abc1234라면 -> https://www.youtube.com/embed/abc1234)
    ========================================================== */
    const caseDatabase = [
        {
            zone: "ZONE-1",
            level: "1급",
            id: "CASE-01",
            title: "청하공고 폐교 수색 및 피격 푸티지",
            date: "2004-10-14",
            modalHeader: "[ZONE-1 / 기밀 1급] 청하공고 내부 탐사 기록",
            content: `
                <b>[사건 개요]</b><br>
                2004.10.14 23:42 수색 투입. 지상 탐사 로봇 ROVER-02 영상 복구본. 3층 교실 미닫이문 상단에서 거꾸로 매달린 기형 인영 포착 후 신호 두절.<br><br>
                <b>[녹취 기록]</b><br>
                “창밖에서 부르는 소리에 절대 응답하지 마십시오...”
            `,
            // 💡 여기에 영상 주소를 넣으면 팝업 내부에서 바로 재생됩니다!
            videoUrl: "https://youtube.com/shorts/SRjNDKaGD1o?si=9S5lSA_QeoeEDTYz" 
        },
        {
            zone: "ZONE-3",
            level: "3급",
            id: "CASE-02",
            title: "국도 44호선 심야 블랙박스 복구 기록",
            date: "2001-07-22",
            modalHeader: "[ZONE-3 / 기밀 3급] 국도 44호선 인영 반복 포착",
            content: `
                <b>[사건 개요]</b><br>
                가로등 점멸 구간마다 동일 체격의 인영이 100m 간격으로 반복 포착됨. 차량 운전자 실종.
            `,
            videoUrl: "" // 영상이 없는 문서는 버튼 자동 숨김
        }
    ];

    let currentZone = 'ALL';
    let currentVideoUrl = '';

    function switchZone(zoneKey) {
        currentZone = zoneKey;
        document.querySelectorAll('.zone-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText.includes(zoneKey) || (zoneKey === 'ALL' && btn.innerText === 'ALL')) {
                btn.classList.add('active');
            }
        });
        document.getElementById('zoneDescription').innerText = zoneDescriptions[zoneKey];
        renderList();
    }

    function getBadgeClass(level) {
        if (level === '1급') return 'badge-lv1';
        if (level === '2급') return 'badge-lv2';
        return 'badge-lv3';
    }

    function renderList() {
        const listElement = document.getElementById('archiveList');
        listElement.innerHTML = '';

        const filtered = caseDatabase.filter(item => currentZone === 'ALL' || item.zone === currentZone);

        if (filtered.length === 0) {
            listElement.innerHTML = '<li style="color:#558866; padding:15px;">>> 해당 구역에 등록된 회수 기록이 없습니다.</li>';
            return;
        }

        filtered.forEach(item => {
            const originalIndex = caseDatabase.indexOf(item);
            const li = document.createElement('li');
            li.className = 'archive-item';
            li.onclick = () => openModal(originalIndex);
            li.innerHTML = `
                <div>
                    <span class="badge ${getBadgeClass(item.level)}">${item.level}</span>
                    <span>[${item.zone}] ${item.title}</span>
                </div>
                <span class="date">${item.date}</span>
            `;
            listElement.appendChild(li);
        });
    }

    function openModal(index) {
        const item = caseDatabase[index];
        document.getElementById('modalTitle').innerHTML = item.modalHeader;
        document.getElementById('modalBody').innerHTML = item.content;

        const vBtn = document.getElementById('videoPlayBtn');
        if (item.videoUrl && item.videoUrl.trim() !== '') {
            currentVideoUrl = item.videoUrl;
            vBtn.style.display = 'block';
        } else {
            currentVideoUrl = '';
            vBtn.style.display = 'none';
        }

        document.getElementById('archiveModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('archiveModal').style.display = 'none';
    }

    // 🎥 내부 플레이어 열기 / 닫기
    function openVideoPlayer() {
        if (!currentVideoUrl) return;
        const frame = document.getElementById('videoPlayerFrame');
        // 자동 재생 및 음산한 UI 적용
        frame.src = currentVideoUrl + (currentVideoUrl.includes('?') ? '&' : '?') + 'autoplay=1&rel=0';
        document.getElementById('videoModal').style.display = 'flex';
    }

    function closeVideoPlayer() {
        const frame = document.getElementById('videoPlayerFrame');
        frame.src = ''; // 닫을 때 영상 중지
        document.getElementById('videoModal').style.display = 'none';
    }

    renderList();
</script>

</body>
</html>
